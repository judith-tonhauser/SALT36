// this function shuffles an array
function shuffle(array) {
   for (var i = array.length - 1; i > 0; i--) { 
         // Generate random number 
       var j = Math.floor(Math.random() * (i + 1));
       var temp = array[i];
       array[i] = array[j];
       array[j] = temp;
   }
      
   return array;
}

}

// function to get a random utterance type
function getUttType() {
    uttType = _.sample(utteranceTypes)
  return uttType
}

// function to get a prior
function getPrior() {
    prior = _.sample(priors)
  return prior
}

// function to get a random content and remove it from array
function getContent() {
    content = _.sample(contents)
  return content
}

// function to get a random qud and remove it from array
function getQUD() {
    qud = _.sample(quds)
  return qud
}

// function to map utterance type to binary utterance type
function getbinType(uttType) {
    binType = uttTypeBinary[uttType]
  return binType
}

// function to get an utteranceType
function getUtteranceType() {
    uttType = shuffle(utteranceTypes).shift()
    return uttType
}

// function to get an actual utterance
function getUtterance(content,uttType) {
    utterance = utterances[content][uttType]
    return utterance
}

// function to get the first part of the context, given a content, binary utterance type
// and qud
function getContextPart1(content,binType,qud) {
    contextPart1 = contextsPart1[content][binType][qud]
    return contextPart1
}

// function to get the second part of the context, given a content, binary utterance type
// qud and prior
function getContextPart2(content,uttType,qud,prior) {
    contextPart2 = contextsPart2[content][uttType][qud][prior]
    return contextPart2
}

  }
